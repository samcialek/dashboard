  <script>
    // Colors - David Hockney inspired vibrant palette
    const COLORS = {
      aligned: '#00D4FF',      // Hockney pool turquoise
      neutral: '#FFE135',      // Bright sunflower yellow
      opposed: '#FF6B6B',      // Vibrant coral red
      noData: '#FFFFFF',       // White for countries without data
      black: '#1a1a1a',
      cream: '#FFFEF8'
    };
    
    // Alignment color scale: Coral (opposed) → Yellow (neutral) → Turquoise (aligned)
    const alignmentScale = d3.scaleLinear()
      .domain([-1, 0, 1])
      .range([COLORS.opposed, COLORS.neutral, COLORS.aligned])
      .interpolate(d3.interpolateRgb);
    
    // Calculate alignment AND certainty between respondent and regime
    function calculateAlignmentWithCertainty(respondent, regime) {
      if (!regime || !regime.profile) return { alignment: 0, certainty: 0.3 };
      
      const weights = { economic: 0.25, democracy: 0.30, social: 0.20, nationalism: 0.15, religion: 0.10 };
      let alignment = 0;
      let certainty = 0;
      let totalWeight = 0;
      
      for (const dim of Object.keys(weights)) {
        if (respondent[dim] !== undefined && regime.profile[dim] !== undefined) {
          const rVal = respondent[dim];
          const gVal = regime.profile[dim];
          const w = weights[dim];
          
          // Alignment: how similar are they?
          const distance = Math.abs(rVal - gVal) / 2;
          const similarity = 1 - distance;
          alignment += (similarity * 2 - 1) * w;
          
          // Certainty: how distinctive are BOTH positions?
          // High certainty when both respondent and regime have strong (non-zero) positions
          // |r| * |g| = 1 when both are at extremes, 0 when either is neutral
          const distinctiveness = Math.abs(rVal) * Math.abs(gVal);
          
          // Also boost certainty when positions are clearly opposed or aligned (not mixed)
          const directionClarity = Math.abs(rVal * gVal); // High when same sign and extreme
          
          certainty += (distinctiveness * 0.7 + directionClarity * 0.3) * w;
          totalWeight += w;
        }
      }
      
      if (totalWeight === 0) return { alignment: 0, certainty: 0.3 };
      
      // Normalize
      alignment = alignment / totalWeight;
      certainty = certainty / totalWeight;
      
      // Apply regime-level certainty modifier if specified
      if (regime.certainty !== undefined) {
        certainty *= regime.certainty;
      }
      
      // Scale certainty to useful opacity range (0.25 to 1.0)
      // Never fully transparent, but uncertain = quite faded
      certainty = 0.25 + (certainty * 0.75);
      
      return { alignment, certainty };
    }
    
    // Get color for a given alignment (no certainty/opacity)
    function getAlignmentColor(alignment, certainty) {
      const baseColor = alignmentScale(alignment);
      // Return solid color without opacity
      return baseColor;
    }

    legendCanvas.height = 12;

    gradient.addColorStop(0, COLORS.opposed);
    gradient.addColorStop(0.5, COLORS.neutral);
    gradient.addColorStop(1, COLORS.aligned);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 150, 12);
    
    // Available historical map years (verified from aourednik/historical-basemaps)
    // These are the actual years that exist in the repository
    const availableMapYears = [1715, 1783, 1815, 1880, 1914, 1920, 1938, 1945, 1960, 1994];
    const mapBaseUrl = 'https://raw.githubusercontent.com/aourednik/historical-basemaps/master/geojson/';
    const modernMapUrl = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
    const mapCache = {};
    let useModernMap = false;
    
    // ============================================
    // RESPONDENT PROFILE - Loaded from quiz results
    // ============================================
    let respondentProfile;
    let userArchetype = null;

    // Try to load from localStorage (quiz results)
    const storedResults = localStorage.getItem('prism_quiz_results');
    if (storedResults) {
      try {
        const results = JSON.parse(storedResults);
        const l2 = results.l2;
        userArchetype = results.archetype;

        // Convert L2 (0-100) to map scale (-1 to 1)
        respondentProfile = {
          economic: (l2.MAT - 50) / 50 * -1,      // Invert: high MAT = free market = negative
          democracy: (l2.PRO - 50) / 50 * -1,     // Invert: high PRO = outcome = negative democracy
          social: (l2.CSO - 50) / 50 * -1,        // Invert: high CSO = traditional = negative social
          nationalism: (l2.CNA - 50) / 50,        // Direct: high CNA = nationalist = positive
          religion: (l2.CSO - 50) / 50            // Use CSO as proxy
        };

        // Update profile badge with archetype
        document.getElementById('profile-badge-title').textContent = userArchetype ? userArchetype.name : 'Your Profile';
        document.getElementById('profile-badge-desc').textContent = userArchetype ? userArchetype.desc : `MAT:${l2.MAT} CSO:${l2.CSO} CNA:${l2.CNA} PRO:${l2.PRO}`;
      } catch (e) {

    // Find closest available map year (always use the most recent year that doesn't exceed current year)
    function getClosestMapYear(year) {
      // For years after 1990, use modern map (USSR dissolved 1991, this also fixes Tibet)
      if (year > 1990) return 'modern';
      
      // Find the highest available year that is <= requested year
      let closest = availableMapYears[0];
      for (const mapYear of availableMapYears) {
        if (mapYear <= year) closest = mapYear;
        else break;
      }
      return closest;
    }
    
    // Load a map with fallback
    async function loadMap(mapYear) {
      if (mapCache[mapYear]) return mapCache[mapYear];
      
      document.getElementById('loading').style.display = 'block';
      
      // Use modern TopoJSON for recent years
      if (mapYear === 'modern') {
        try {
          const response = await fetch(modernMapUrl);
          if (!response.ok) throw new Error('Failed to load modern map');
          const topoData = await response.json();
          // Convert TopoJSON to GeoJSON-like structure
          const countries = topojson.feature(topoData, topoData.objects.countries);
          // Add NAME property from id for compatibility
          countries.features.forEach(f => {
            if (!f.properties) f.properties = {};
            f.properties.NAME = getCountryNameFromId(f.id);
          });
          mapCache[mapYear] = countries;
          document.getElementById('loading').style.display = 'none';
          return countries;
        } catch (error) {
          console.error('Error loading modern map:', error);
          document.getElementById('loading').style.display = 'none';
          return null;
        }
      }
      
      // Try to load historical map
      try {
        const url = `${mapBaseUrl}world_${mapYear}.geojson`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Failed to load map for ${mapYear}`);
        const data = await response.json();
        mapCache[mapYear] = data;
        document.getElementById('loading').style.display = 'none';
        return data;
      } catch (error) {
        console.error(`Error loading map for ${mapYear}:`, error);
        
        // Fallback: try the previous available year
        const currentIndex = availableMapYears.indexOf(mapYear);
        if (currentIndex > 0) {
          const fallbackYear = availableMapYears[currentIndex - 1];
          console.log(`Falling back to ${fallbackYear}`);
          return loadMap(fallbackYear);
        }
        
        // Ultimate fallback: use modern map
        document.getElementById('loading').style.display = 'none';
        return loadMap('modern');
      }
    }
    
    // Map numeric country IDs to names (for modern TopoJSON)
    function getCountryNameFromId(id) {
      const countryIdMap = {
        4: 'Afghanistan', 8: 'Albania', 12: 'Algeria', 24: 'Angola', 32: 'Argentina',
        36: 'Australia', 40: 'Austria', 50: 'Bangladesh', 56: 'Belgium', 68: 'Bolivia',

        124: 'Canada', 144: 'Sri Lanka', 152: 'Chile', 156: 'China', 170: 'Colombia',

        203: 'Czechia', 208: 'Denmark', 214: 'Dominican Republic', 218: 'Ecuador',

        276: 'Germany', 288: 'Ghana', 300: 'Greece', 320: 'Guatemala', 332: 'Haiti',
        340: 'Honduras', 348: 'Hungary', 352: 'Iceland', 356: 'India', 360: 'Indonesia',
        364: 'Iran', 368: 'Iraq', 372: 'Ireland', 376: 'Israel', 380: 'Italy',
        384: 'Ivory Coast', 388: 'Jamaica', 392: 'Japan', 400: 'Jordan', 398: 'Kazakhstan',
        404: 'Kenya', 408: 'North Korea', 410: 'South Korea', 414: 'Kuwait', 422: 'Lebanon',
        434: 'Libya', 440: 'Lithuania', 458: 'Malaysia', 484: 'Mexico', 504: 'Morocco',
        508: 'Mozambique', 528: 'Netherlands', 554: 'New Zealand', 558: 'Nicaragua',
        566: 'Nigeria', 578: 'Norway', 586: 'Pakistan', 591: 'Panama', 598: 'Papua New Guinea',
        600: 'Paraguay', 604: 'Peru', 608: 'Philippines', 616: 'Poland', 620: 'Portugal',
        630: 'Puerto Rico', 634: 'Qatar', 642: 'Romania', 643: 'Russia', 682: 'Saudi Arabia',
        688: 'Serbia', 702: 'Singapore', 703: 'Slovakia', 704: 'Vietnam', 705: 'Slovenia',
        706: 'Somalia', 710: 'South Africa', 724: 'Spain', 729: 'Sudan', 752: 'Sweden',
        756: 'Switzerland', 760: 'Syria', 764: 'Thailand', 792: 'Turkey', 804: 'Ukraine',
        784: 'United Arab Emirates', 826: 'United Kingdom', 840: 'United States',
        858: 'Uruguay', 860: 'Uzbekistan', 862: 'Venezuela', 887: 'Yemen', 894: 'Zambia',
        716: 'Zimbabwe'
      };
      return countryIdMap[id] || `Country ${id}`;
    }
    
    // Get regime data for a country name and year
    function getRegimeForYear(countryName, year) {
      if (!countryName) return null;
      
      let data = regimeData[countryName];
      
      // Check for alias
      if (data && data.alias) {
        data = regimeData[data.alias];
      }
      
      // Try partial matches
      if (!data) {
        for (const key of Object.keys(regimeData)) {
          if (countryName.includes(key) || key.includes(countryName)) {
            data = regimeData[key];
            if (data && data.alias) data = regimeData[data.alias];
            break;
          }
        }
      }
      
      if (!data || !data.eras) return null;
      
      for (const era of data.eras) {
        if (year >= era.start && year < era.end) {
          return { ...era, countryName };
        }
      }
      
      const lastEra = data.eras[data.eras.length - 1];
      if (year >= lastEra.start) {
        return { ...lastEra, countryName };
      }
      
      return null;
    }
    
    // Get alignment label
    function getAlignmentLabel(score) {
      if (score > 0.6) return 'Strongly Aligned';
      if (score > 0.3) return 'Aligned';
      if (score > 0.1) return 'Somewhat Aligned';
      if (score > -0.1) return 'Neutral';
      if (score > -0.3) return 'Somewhat Opposed';
      if (score > -0.6) return 'Opposed';
      return 'Strongly Opposed';
    }
    
    // Get certainty label
    function getCertaintyLabel(certainty) {
      // certainty is already scaled to 0.25-1.0 range
      const normalized = (certainty - 0.25) / 0.75; // back to 0-1
      if (normalized > 0.7) return 'High confidence';
      if (normalized > 0.4) return 'Moderate confidence';
      return 'Low confidence';
    }
    
    // State
    const svg = d3.select('#map');
    const tooltip = d3.select('#tooltip');
    const yearDisplay = d3.select('#year-display');
    const mapYearLabel = d3.select('#map-year-label');
    const slider = d3.select('#year-slider');
    const playBtn = d3.select('#play-btn');
    
    let currentYear = 1789;
    let currentMapYear = null;
    let currentGeoData = null;
    let isPlaying = false;
    let playInterval;
    
    // Render
    async function render(year) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      svg.attr('width', width).attr('height', height);
      
      const projection = d3.geoNaturalEarth1()
        .scale(Math.min(width / 5.5, height / 2.8))
        .translate([width / 2, (height + 60) / 2]);
      
      const path = d3.geoPath().projection(projection);
      
      const mapYear = getClosestMapYear(year);
      
      if (mapYear !== currentMapYear || !currentGeoData) {
        currentMapYear = mapYear;
        currentGeoData = await loadMap(mapYear);
        mapYearLabel.text(mapYear === 'modern' ? '(borders: current)' : `(borders: ${mapYear})`);
      }
      
      if (!currentGeoData) return;
      
      svg.selectAll('*').remove();
      
      // Ocean
      svg.append('path')
        .datum({ type: 'Sphere' })
        .attr('class', 'ocean')
        .attr('d', path);
      
      // Graticule
      const graticule = d3.geoGraticule();
      svg.append('path')
        .datum(graticule)
        .attr('class', 'graticule')
        .attr('d', path);
      
      // Countries
      svg.selectAll('.country')
        .data(currentGeoData.features)
        .enter()
        .append('path')
        .attr('class', 'country')
        .attr('d', path)
        .attr('fill', d => {
          const name = d.properties.NAME || d.properties.name || '';
          const regime = getRegimeForYear(name, year);
          if (!regime) return COLORS.noData;
          const { alignment, certainty } = calculateAlignmentWithCertainty(respondentProfile, regime);
          return getAlignmentColor(alignment, certainty);
        })
        .on('mouseover', function(event, d) {
          const name = d.properties.NAME || d.properties.name || 'Unknown';
          const regime = getRegimeForYear(name, currentYear);
          
          if (!regime) {
            tooltip.style('opacity', 1)
              .html(`
                <div class="tooltip-header">
                  <div class="tooltip-image" style="display: flex; align-items: center; justify-content: center; color: #666; font-size: 18px;">?</div>
                  <div class="tooltip-info">
                    <div class="tooltip-country">${name}</div>
                    <div class="tooltip-leader">No data available</div>
                  </div>
                </div>
              `);
            return;
          }
          
          const { alignment, certainty } = calculateAlignmentWithCertainty(respondentProfile, regime);
          const alignmentLabel = getAlignmentLabel(alignment);
          const certaintyLabel = getCertaintyLabel(certainty);
          const alignmentColor = getAlignmentColor(alignment, certainty);
          
          let imageHtml = `<div class="tooltip-image" style="display: flex; align-items: center; justify-content: center; color: #666; font-size: 18px;">🏛️</div>`;
          if (regime.image) {
            imageHtml = `<img class="tooltip-image" src="${regime.image}" alt="${regime.leader}" onerror="this.outerHTML='<div class=\\'tooltip-image\\' style=\\'display: flex; align-items: center; justify-content: center; color: #666; font-size: 18px;\\'>🏛️</div>'">`;
          }
          
          tooltip.style('opacity', 1)
            .html(`
              <div class="tooltip-header">
                ${imageHtml}
                <div class="tooltip-info">
                  <div class="tooltip-country">${regime.countryName}</div>
                  <div class="tooltip-leader">${regime.leader}</div>
                  <div class="tooltip-party">
                    <div class="party-color-dot" style="background: ${regime.partyColor}"></div>
                    ${regime.party}
                  </div>
                </div>
              </div>
              <div class="tooltip-alignment" style="background: ${alignmentColor}; color: ${alignment > 0.2 ? '#1a1a1a' : '#FFFEF8'}">
                <span class="alignment-label">Your Alignment</span>
                <span class="alignment-value">${alignmentLabel}</span>
              </div>
              <div class="tooltip-certainty">
                <span class="certainty-label">Certainty</span>
                <span class="certainty-value">${certaintyLabel}</span>
              </div>
            `);
        })
        .on('mousemove', function(event) {
          tooltip
            .style('left', (event.pageX + 15) + 'px')
            .style('top', (event.pageY - 10) + 'px');
        })
        .on('mouseout', function() {
          tooltip.style('opacity', 0);
        });
    }
    
    // Update year
    async function updateYear(year) {
      currentYear = year;
      yearDisplay.text(year);
      slider.property('value', year);
      
      const newMapYear = getClosestMapYear(year);
      
      if (newMapYear !== currentMapYear) {
        await render(year);
      } else {
        svg.selectAll('.country')
          .transition()
          .duration(50)
          .attr('fill', d => {
            const name = d.properties.NAME || d.properties.name || '';
            const regime = getRegimeForYear(name, year);
            if (!regime) return COLORS.noData;
            const { alignment, certainty } = calculateAlignmentWithCertainty(respondentProfile, regime);
            return getAlignmentColor(alignment, certainty);
          });
      }
    }
    
    // Events
    slider.on('input', async function() {
      await updateYear(+this.value);
    });
    
    playBtn.on('click', function() {
      if (isPlaying) {
        isPlaying = false;
        clearInterval(playInterval);
        playBtn.text('▶ Play');
      } else {
        isPlaying = true;
        playBtn.text('⏸ Pause');
        
        if (currentYear >= 2024) currentYear = 1789;

        playInterval = setInterval(async () => {
          currentYear += 1;
          if (currentYear > 2024) currentYear = 1789;
          await updateYear(currentYear);
        }, 80);
      }
    });
    
    window.addEventListener('resize', () => render(currentYear));
    render(currentYear);
  </script>
