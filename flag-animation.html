<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flag Litmus Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }

.container { max-width: 420px; width: 100%; }

h1 { font-size: 20px; text-align: center; margin-bottom: 4px; color: #fff; }
.subtitle { font-size: 13px; color: #666; text-align: center; margin-bottom: 36px; }

.pairs { display: flex; flex-direction: column; gap: 20px; margin-bottom: 32px; }

.pair { display: flex; align-items: center; justify-content: center; gap: 16px; }

.flag {
  width: 88px; height: 58px; border: 2px solid #222; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  background: #111; transition: all 0.4s ease; opacity: 0.25; overflow: hidden;
}
.flag img { width: 100%; height: 100%; object-fit: cover; }
.flag.active {
  border-color: #69f0ae; box-shadow: 0 0 14px rgba(105, 240, 174, 0.3);
  opacity: 1; transform: scale(1.1);
}
.flag.dimmed { opacity: 0.12; }

.vs { font-size: 13px; color: #444; font-weight: 700; }

.result-box {
  background: #111122; border: 1px solid #222; border-radius: 10px;
  padding: 20px; text-align: center; transition: all 0.4s ease;
  min-height: 60px; display: flex; align-items: center; justify-content: center;
}
.result-text {
  font-size: 28px; font-weight: 800; letter-spacing: 1px;
  transition: all 0.4s ease; opacity: 0;
}
.result-text.show { opacity: 1; }

.footer { margin-top: 28px; font-size: 11px; color: #333; text-align: center; line-height: 1.5; }
</style>
</head>
<body>

<div class="container">
  <h1>Which flags someone supports...</h1>
  <p class="subtitle">...is a surprisingly good proxy for their politics</p>

  <div class="pairs">
    <div class="pair">
      <div class="flag" id="ua"><img src="https://flagcdn.com/w160/ua.png" alt="Ukraine"></div>
      <span class="vs">vs</span>
      <div class="flag" id="ru"><img src="https://flagcdn.com/w160/ru.png" alt="Russia"></div>
    </div>
    <div class="pair">
      <div class="flag" id="tw"><img src="https://flagcdn.com/w160/tw.png" alt="Taiwan"></div>
      <span class="vs">vs</span>
      <div class="flag" id="cn"><img src="https://flagcdn.com/w160/cn.png" alt="China"></div>
    </div>
    <div class="pair">
      <div class="flag" id="ps"><img src="https://flagcdn.com/w160/ps.png" alt="Palestine"></div>
      <span class="vs">vs</span>
      <div class="flag" id="il"><img src="https://flagcdn.com/w160/il.png" alt="Israel"></div>
    </div>
  </div>

  <div class="result-box">
    <div class="result-text" id="result"></div>
  </div>

  <div class="footer">
    Three binary choices. Six bits of information. And yet...<br>
    From the PRISM framework — matricesofconfusion.com
  </div>
</div>

<script>
const COMBOS = [
  { active: ['ua','tw','ps'], dimmed: ['ru','cn','il'], label: 'Social Democrat', color: '#ff5252' },
  { active: ['ua','tw','il'], dimmed: ['ru','cn','ps'], label: 'Neoliberal', color: '#448aff' },
  { active: ['ru','cn','ps'], dimmed: ['ua','tw','il'], label: 'Tankie', color: '#ffd740' },
  { active: ['ru','cn','il'], dimmed: ['ua','tw','ps'], label: 'Fascist', color: '#888' },
];

const allFlags = ['ua','ru','tw','cn','ps','il'];
const result = document.getElementById('result');
let idx = 0;

function showCombo(combo) {
  result.classList.remove('show');
  setTimeout(() => {
    allFlags.forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('active', 'dimmed');
      if (combo.active.includes(id)) el.classList.add('active');
      else el.classList.add('dimmed');
    });
    setTimeout(() => {
      result.textContent = combo.label;
      result.style.color = combo.color;
      result.classList.add('show');
    }, 400);
  }, 300);
}

function cycle() {
  showCombo(COMBOS[idx]);
  idx = (idx + 1) % COMBOS.length;
}

cycle();
setInterval(cycle, 2800);
</script>
</body>
</html>
